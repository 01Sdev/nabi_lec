<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NaBi 수업자료</title>
<style>
  :root { --bg:#f7f7f8; --card:#fff; --text:#1a1a1a; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111214; --card:#1b1c1f; --text:#f3f4f6; --muted:#9ca3af; --line:#2a2b2f; --accent:#60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 80px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin-bottom: 24px; }
  input { width:100%; padding: 12px 14px; font-size: 1rem; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); margin-bottom: 16px; }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:10px; }
  li a { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 16px; background:var(--card); border:1px solid var(--line); border-radius:12px; text-decoration:none; color:var(--text); }
  li a:hover { border-color: var(--accent); }
  .name { font-weight:600; }
  .meta { color:var(--muted); font-size:.8rem; white-space:nowrap; }
  .empty { color:var(--muted); padding: 24px 0; }
</style>
</head>
<body>
<main>
  <h1>NaBi 수업자료</h1>
  <div class="sub">레포에 올라온 HTML 파일이 자동으로 표시됩니다.</div>
  <input id="q" type="search" placeholder="검색 (예: 중1, 고2, 부채꼴)">
  <ul id="list"></ul>
  <div id="status" class="empty">불러오는 중…</div>
</main>
<script>
(async () => {
  const OWNER = "01Sdev", REPO = "nabi_lec", BRANCH = "main";
  const list = document.getElementById("list");
  const status = document.getElementById("status");
  const q = document.getElementById("q");
  let files = [];

  function render() {
    const term = q.value.trim().toLowerCase();
    const shown = files.filter(f => f.title.toLowerCase().includes(term));
    list.innerHTML = shown.map(f => `
      <li><a href="${encodeURIComponent(f.name)}">
        <span class="name">${f.title}</span>
        <span class="meta">${(f.size/1024).toFixed(0)} KB</span>
      </a></li>`).join("");
    status.textContent = shown.length ? "" : "표시할 파일이 없습니다.";
  }

  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=${BRANCH}`, { headers: { Accept: "application/vnd.github+json" } });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    files = data
      .filter(x => x.type === "file" && /\.html?$/i.test(x.name) && x.name.toLowerCase() !== "index.html")
      .map(x => ({ name: x.name, size: x.size, title: x.name.replace(/\.html?$/i, "") }))
      .sort((a, b) => a.title.localeCompare(b.title, "ko"));
    render();
    q.addEventListener("input", render);
  } catch (e) {
    status.textContent = "목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.";
  }
})();
</script>
</body>
</html>
